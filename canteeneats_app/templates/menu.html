<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Menu</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
}
/* side navigation */
.sidenav {
    height: 100%;
    width: 200px;
    position: fixed; /* Added colon */
    z-index: 1;      /* Added semicolon */
    top: 0;
    left: 0;
    background-color: #111;
    overflow-x: hidden; /* Fixed spelling */
}

/* Side navigation links */
.sidenav a {
    color: #EFE6D2;
    padding: 16px;
    text-decoration: none;
    display: block;
}
/* Change color when hovering */
.sidenav a:hover {
    background-color: #EFE6D2;
    color: black;
}

/* style content */
.content {
    margin-left: 200px;
    padding-left: 20px;
}
</style>
</head>
<body>
    <!-- Changed class from "menu" to "sidenav" to match CSS -->
    <div class="sidenav">
        <a href="register.html">Sign Up</a>
        <a href="login.html">Log in</a>
    </div>

    <div class="content">
        <h2>Menu</h2>
        <p>This is currently in a test mode as of now.</p>
    </div>
</body>
</html>
