<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMSHS Canteen Hub - Menu</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f9f9f9;
        }

        /* 1. TOP RUNTIME CONTROL HEADER BAR */
        .header {
            height: 60px;
            width: 100%; 
            position: fixed;
            top: 0;
            left: 0;
            background-color: #111111; 
            color: #EFE6D2;
            display: flex;
            align-items: center;
            justify-content: space-between; 
            padding: 0 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 3; 
        }

        .header h3 {
            margin: 0;
            font-weight: 500;
        }

        #user-display-tag {
            font-size: 13px;
            color: #EFE6D2;
            font-style: italic;
        }

        /* 2. SIDE NAVIGATION (Scrollable for dynamic components) */
        .sidenav {
            height: calc(100% - 60px); 
            width: 230px; 
            position: fixed; 
            top: 60px; 
            left: 0;
            background-color: #222222; 
            overflow-y: auto; 
            z-index: 2;
        }

        .sidenav-section-header {
            background-color: #1a1a1a;
            color: #888888;
            padding: 10px 16px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2d2d2d;
        }

        .sidenav a {
            color: #EFE6D2;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            border-bottom: 1px solid #2d2d2d; 
            transition: background-color 0.2s, color 0.2s;
        }

        .sidenav a:hover {
            background-color: #EFE6D2;
            color: black;
        }

        .sidenav a.active {
            background-color: #333333;
            border-left: 4px solid #EFE6D2;
        }

        /* 3. MAIN DASHBOARD CONTENT VIEWPORT */
        .content {
            margin-left: 230px; 
            margin-top: 60px;   
            padding: 30px;
            min-height: calc(100vh - 60px);
        }

        .content h2 {
            margin-top: 0;
            border-bottom: 2px solid #222;
            padding-bottom: 8px;
            color: #111;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3>SMSHS Canteen Hub</h3>
        <div>
            <span id="user-display-tag">Validating credentials...</span>
        </div>
    </div>

    <div class="sidenav">
        <div class="sidenav-section-header">Authorized Actions</div>
        
        <div id="dynamic-navigation-links">
            <a href="#" style="color: #666; font-style: italic;">Loading dynamic pathways...</a>
        </div>
    </div>

    <div class="content">
        <h2>Menu Options</h2>
        <p style="color: #555;">Connecting to SQLite data stream segments...</p>
    </div>

    <script src="/js/ui.js"></script>
    <script src="/js/cart.js"></script>
    
    <script>
        // Synchronous interface cue update to show active test profile status
        document.addEventListener("DOMContentLoaded", () => {
            const displayTag = document.getElementById('user-display-tag');
            if (displayTag) {
                const activeRole = localStorage.getItem('userRole') || 'Student';
                displayTag.innerText = `Logged in as: ${activeRole}`;
            }
        });
    </script>
</body>
</html>
