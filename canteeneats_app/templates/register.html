<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMSHS Canteen Hub - Create Account</title>
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-family: 'Arial Black', sans-serif; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px; border: 2px solid var(--border-dark); background: #FFFDF9; font-size: 14px; }
        .auth-btn { width: 100%; padding: 14px; background-color: var(--text-dark); color: #FFFDF9; border: 3px solid var(--border-dark); font-family: 'Arial Black', sans-serif; text-transform: uppercase; cursor: pointer; }
        .auth-footer { margin-top: 25px; text-align: center; border-top: 2px solid var(--border-dark); padding-top: 15px; }
        .error-message { color: red; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="/static/images/logo.png" alt="Logo" style="height: 60px;">
            </div>
            <h2 style="border-bottom: 4px solid var(--border-dark); margin-top: 0;">Register</h2>
            
            <div id="error-box" class="error-message"></div>

            <form id="register-form" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" required>
                </div>
                <button type="submit" class="auth-btn">Create Profile</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Click here to Login</a>
            </div>
        </div>
    </div>

    <script>
        async function handleRegistration(event) {
            event.preventDefault();
            
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const errorBox = document.getElementById('error-box');
            
            // Password Complexity Regex: Min 8 chars, 1 uppercase, 1 number, 1 symbol
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            if (!passwordRegex.test(password)) {
                errorBox.innerText = "Password must be 8+ chars with 1 uppercase, 1 number, and 1 symbol.";
                errorBox.style.display = "block";
                return;
            }

            if (password !== confirm) {
                errorBox.innerText = "Passwords do not match!";
                errorBox.style.display = "block";
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Account created successfully! You can now log in.");
                    window.location.href = "/login";
                } else {
                    errorBox.innerText = data.error || "Registration failed.";
                    errorBox.style.display = "block";
                }
            } catch (error) {
                errorBox.innerText = "Network error. Please try again.";
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
