<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMSHS Canteen Hub - Create Account</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="/static/images/logo.png" alt="Logo" style="height: 60px;">
            </div>
            <h2 style="border-bottom: 4px solid var(--border-dark);">Register</h2>
            
            <form id="register-form" action="/auth/register" method="POST" onsubmit="return validateForm(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" name="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" required>
                </div>
                <button type="submit" class="auth-btn">Create Profile</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Click here to Login</a>
            </div>
        </div>
    </div>

    <script>
        function validateForm(event) {
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            // Password Complexity Regex: Min 8 chars, 1 uppercase, 1 number, 1 symbol
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            if (!passwordRegex.test(password)) {
                alert("Password must be 8+ chars with 1 uppercase letter, 1 number, and 1 symbol.");
                return false;
            }

            if (password !== confirm) {
                alert("Passwords do not match!");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
