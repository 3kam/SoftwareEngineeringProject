<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>My Orders & Cart - CanteenEats</title>
    <style>
        body { margin: 0; background-color: #ebc67e; display: flex; flex-direction: column; min-height: 100vh; font-family: Arial, sans-serif; }
        header { background-color: #046307; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #111; }
        nav { display: flex; align-items: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 14px; cursor: pointer; }
        
        .balance-badge { background-color: white; color: #046307; padding: 8px 15px; border-radius: 20px; font-weight: bold; margin-right: 20px; border: 2px solid #111; }

        main { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .order-card { background: white; padding: 30px; width: 100%; max-width: 900px; border: 3px solid #111; box-shadow: 8px 8px 0px #111; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        th { font-family: "Arial Black", sans-serif; text-transform: uppercase; }
        
        .search-input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #111; box-sizing: border-box; }
        header a img { display: block; }

        .remove-btn { background: #d9534f; color: white; border: 2px solid #111; padding: 5px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .remove-btn:hover { background: #c9302c; }
        .checkout-row { background: #f9f9f9; font-weight: bold; font-size: 18px; }
        
        /* Period Selector Box */
        .period-box { margin-top: 20px; padding: 15px; border: 2px dashed #111; background-color: #fafafa; }
        .period-box h4 { margin-top: 0; text-transform: uppercase; font-family: "Arial Black", sans-serif; font-size: 14px; }
        .options-group { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; }
        .options-group label { font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .options-group input[type="radio"] { accent-color: #046307; transform: scale(1.2); }

        .pay-btn { background: #046307; color: white; border: 2px solid #111; padding: 10px 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 16px; float: right; margin-top: 20px; }
        .pay-btn:hover { background: #034f05; }
    </style>
</head>
<body>
    <header>
        <a id="logo-link" href="#"><img src="/static/images/logo.png" alt="Logo" style="height: 50px" /></a>
        <nav>
            <div class="balance-badge" id="nav-balance">Balance: $0.00</div>
            <div id="nav-links-container" style="display: inline-flex; align-items: center;"></div>
            <a onclick="logoutSecurely()">Logout</a>
        </nav>
    </header>

    <main>
        <div class="order-card">
            <h2>Items in Cart (Pending Payment)</h2>
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">Cancel</th>
                        <th>Item</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="cart-body"></tbody>
                <tfoot>
                    <tr class="checkout-row">
                        <td colspan="2" style="text-align: right;">Total to Pay:</td>
                        <td id="cart-total">$0.00</td>
                    </tr>
                </tfoot>
            </table>

            <div class="period-box">
                <h4>Select Target Pickup Interval:</h4>
                <div class="options-group">
                    <label><input type="radio" name="pickup-interval" value="Period 1 (P1)"> Period 1 (P1)</label>
                    <label><input type="radio" name="pickup-interval" value="Recess (R)"> Recess (R)</label>
                    <label><input type="radio" name="pickup-interval" value="Period 2 (P2)"> Period 2 (P2)</label>
                    <label><input type="radio" name="pickup-interval" value="Period 3 (P3)"> Period 3 (P3)</label>
                    <label><input type="radio" name="pickup-interval" value="Lunch (L)"> Lunch (L)</label>
                    <label><input type="radio" name="pickup-interval" value="Period 4 (P4)"> Period 4 (P4)</label>
                </div>
            </div>

            <button class="pay-btn" onclick="processPayment()">Pay Now</button>
            <div style="clear: both;"></div> 
        </div>

        <div class="order-card">
            <h2>My Order History</h2>
            <input type="text" class="search-input" placeholder="Search by product name..." />
            <table>
                <thead><tr><th>Date</th><th>Order ID</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="order-body"></tbody>
            </table>
        </div>
    </main>

    <script>
        const role = localStorage.getItem('userRole') || 'Student';
        if (role !== 'Student') window.location.replace('/menu');

        let currentBalance = parseFloat(localStorage.getItem('studentBalance'));
        if (isNaN(currentBalance)) {
            currentBalance = 12.00;
            localStorage.setItem('studentBalance', currentBalance.toFixed(2));
        }
        document.getElementById('nav-balance').innerText = `Balance: $${currentBalance.toFixed(2)}`;

        function setupNavigation() {
            const navContainer = document.getElementById('nav-links-container');
            const logoLink = document.getElementById('logo-link');
            logoLink.href = '/menu';
            navContainer.innerHTML = `<a href="/menu">Menu</a><a href="/my_orders">My Orders</a><a href="/about">About Us</a>`;
        }

        function loadPendingCart() {
            let cart = JSON.parse(localStorage.getItem('canteenCart')) || [];
            const cartBody = document.getElementById('cart-body');
            
            if (cart.length === 0) {
                cartBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Your cart is empty. Please visit the menu.</td></tr>';
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            let total = 0;
            cartBody.innerHTML = cart.map((item, index) => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;
                return `
                    <tr>
                        <td><button class="remove-btn" onclick="removeItem(${index})">X</button></td>
                        <td>${item.item_name} (x${item.quantity})</td>
                        <td>$${itemTotal.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
            document.getElementById('cart-total').dataset.rawTotal = total;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('canteenCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('canteenCart', JSON.stringify(cart));
            loadPendingCart();
        }

        async function processPayment() {
            let cart = JSON.parse(localStorage.getItem('canteenCart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            // Radio Button Validation
            const checkedRadio = document.querySelector('input[name="pickup-interval"]:checked');
            if (!checkedRadio) {
                alert("Please select a school pickup period or break window before paying.");
                return;
            }

            // Time and Day Constraints Check
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const absoluteMinutes = (currentHour * 60) + currentMinute;

            const windowStart = (7 * 60) + 50; // 7:50 AM -> 470 minutes
            const windowEnd = (21 * 60) + 38;  // 9:38 PM -> 1358 minutes

            if (dayOfWeek === 0 || dayOfWeek === 6 || absoluteMinutes < windowStart || absoluteMinutes > windowEnd) {
                alert("Transaction Blocked: Canteen layout portal operates exclusively Monday to Friday between 7:50 AM and 1:38 PM.");
                return;
            }

            let cartTotal = parseFloat(document.getElementById('cart-total').dataset.rawTotal);
            if (cartTotal > currentBalance) {
                alert(`Insufficient funds! Your total is $${cartTotal.toFixed(2)} but your balance is only $${currentBalance.toFixed(2)}.`);
                return;
            }

            // Submit order payload to express route
            try {
                const response = await fetch('/api/orders/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cart: cart,
                        total_price: cartTotal,
                        pickup_period: checkedRadio.value
                    })
                });

                if (response.ok) {
                    currentBalance -= cartTotal;
                    localStorage.setItem('studentBalance', currentBalance.toFixed(2));
                    document.getElementById('nav-balance').innerText = `Balance: $${currentBalance.toFixed(2)}`;
                    localStorage.removeItem('canteenCart');
                    loadPendingCart();
                    loadOrderHistory();
                    alert("Payment Successful! Your order has been dispatched to the live kitchen console.");
                } else {
                    const errData = await response.json();
                    alert("Checkout Failed: " + (errData.error || "Server processing issue"));
                }
            } catch (err) {
                alert("Network error communicating with canteen server logic.");
            }
        }

        async function loadOrderHistory() {
            try {
                const response = await fetch("/api/my-orders");
                const orders = await response.json();
                const tbody = document.getElementById("order-body");
                tbody.innerHTML = orders.map(o => `
                    <tr><td>${o.date}</td><td>${o.order_id}</td><td>${o.items}</td><td>$${parseFloat(o.total_price).toFixed(2)}</td><td><strong>${o.status}</strong></td></tr>
                `).join("");
            } catch (error) { 
                console.error("Error loading orders:", error); 
            }
        }

        function logoutSecurely() {
            localStorage.clear();
            window.location.replace('/');
        }

        setupNavigation();
        loadPendingCart();
        loadOrderHistory();
    </script>
</body>
</html>
