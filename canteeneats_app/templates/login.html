<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Login - CanteenEats</title>
    <style>
        body { margin: 0; background-color: #ebc67e; font-family: Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border: 4px solid #111; box-shadow: 8px 8px 0px #111; width: 300px; text-align: center; }
        .login-card h2 { font-family: 'Arial Black', sans-serif; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 2px solid #111; font-weight: bold; }
        button { background: #111; color: white; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 15px; font-family: 'Arial Black', sans-serif;}
        button:hover { background: #046307; }
        .back-link { margin-top: 15px; font-size: 14px; display: block; color: #111; text-decoration: none; font-weight: bold;}
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>LOGIN</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <a href="/" class="back-link">Back to Home</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page refresh

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save the session data locally
                    localStorage.setItem('userId', data.id);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', data.username);

                    // Route based on role
                    if (data.role === 'Administrator') {
                        window.location.href = '/edit_account';
                    } else if (data.role === 'Staff') {
                        window.location.href = '/manage_orders';
                    } else {
                        window.location.href = '/menu';
                    }
                } else {
                    alert(data.error || "Login failed.");
                }
            } catch (err) {
                console.error(err);
                alert("Network error occurred.");
            }
        });
    </script>
</body>
</html>
