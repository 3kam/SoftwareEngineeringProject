<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMSHS Canteen Hub - Sign In</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-family: 'Arial Black', sans-serif; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px; border: 2px solid var(--border-dark); background: #FFFDF9; font-size: 14px; }
        .auth-btn { width: 100%; padding: 14px; background-color: var(--text-dark); color: #FFFDF9; border: 3px solid var(--border-dark); font-family: 'Arial Black', sans-serif; text-transform: uppercase; cursor: pointer; }
        .auth-footer { margin-top: 25px; text-align: center; border-top: 2px solid var(--border-dark); padding-top: 15px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="/static/images/logo.png" alt="Logo" style="height: 60px;">
            </div>
            <h2 style="margin-top: 0; font-size: 32px; font-family: 'Arial Black', sans-serif; text-transform: uppercase; border-bottom: 4px solid var(--border-dark);">Sign In</h2>
            <form id="login-form" onsubmit="handleSmartAuthRedirect(event)">
                <div class="form-group">
                    <label for="username-input">Account Username</label>
                    <input type="text" id="username-input" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password-input">Password Token</label>
                    <input type="password" id="password-input" class="form-control" required>
                </div>
                <button type="submit" class="auth-btn">Authenticate</button>
            </form>
            <div class="auth-footer">New user? <a href="/register">Create an Account</a></div>
        </div>
    </div>
    <script>
        function handleSmartAuthRedirect(event) {
            event.preventDefault();
            window.location.replace("/menu");
        }
    </script>
</body>
</html>
